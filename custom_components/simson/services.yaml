call:
  fields:
    from_extension:
      required: true
      example: "1201"
      selector:
        text:
    to_extension:
      required: true
      example: "1202"
      selector:
        text:
    video:
      default: false
      selector:
        boolean:
    timeout:
      default: 30
      selector:
        number:
          min: 10
          max: 120
          unit_of_measurement: s
    config_entry_id:
      selector:
        config_entry:
          integration: simson
hangup:
  fields:
    call_id:
      required: true
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: simson
call_extension:
  fields:
    to_extension:
      required: true
      example: "1202"
      selector:
        text:
    from_extension:
      example: "1201"
      selector:
        text:
    video:
      default: false
      selector:
        boolean:
    timeout:
      default: 30
      selector:
        number:
          min: 10
          max: 120
          unit_of_measurement: s
    config_entry_id:
      selector:
        config_entry:
          integration: simson
run_call_preset:
  fields:
    preset:
      required: true
      example: Doorbell
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: simson
get_call_history:
  fields:
    limit:
      default: 25
      selector:
        number:
          min: 1
          max: 200
    config_entry_id:
      selector:
        config_entry:
          integration: simson
get_extensions:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: simson
get_numbers:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: simson
get_call_presets:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: simson
get_targets:
  name: Get Simson call targets
  description: List enabled extensions, configured phone groups and callable presets at one location.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: simson
